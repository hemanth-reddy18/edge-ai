[general]
static=yes
writeprotect=yes

[from-internal]
; Dial 1000 or 100 to connect directly to the Edge AI Receptionist on Vivo
exten => 1000,1,NoOp(Inbound SIP Call to Edge AI Receptionist from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.2)
 same => n,AudioSocket(d5145b40-a352-11eb-a836-0242ac110002,host.docker.internal:9099)
 same => n,Hangup()

exten => 100,1,Goto(from-internal,1000,1)

; Inter-extension dialing
exten => 1001,1,Dial(PJSIP/1001,20)
 same => n,Hangup()

exten => 1002,1,Dial(PJSIP/1002,20)
 same => n,Hangup()
