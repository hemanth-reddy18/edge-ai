[global]
type=global
user_agent=Edge-Local-Asterisk-PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.0.0/24
local_net=127.0.0.1/32
local_net=172.16.0.0/12

; Extension 1001: Softphone for Second Android Phone
[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
allow=g722
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
username=1001
password=EdgeLocalVoice2026!

[1001]
type=aor
max_contacts=2
remove_existing=yes

